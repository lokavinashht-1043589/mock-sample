<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Mock Flow (adapter harness)</title>
    <!--
      A STAND-IN for Google Flow, used to exercise the real content-script code
      (selectors.js, dom-utils.js, flow-adapter.js) in a browser. It is modelled on the
      *assumed* Flow UI — passing here proves the adapter logic works, NOT that the
      selectors match the real Flow. Use Flow Diagnostics on the real site for that.

      Behaviour mirrored from the real site:
        - a prompt produces a video directly (no image/animate step)
        - the submit control is an icon-only arrow that ignores script (untrusted) clicks
        - after the first video, a result viewer opens with ITS OWN prompt box (placed first in
          the DOM) — prompts must never go there
        - later results can be collapsed behind an inline "Show 1 Videos" button
        - a finished tile keeps its "100%" progress label on screen for a while
        - the next prompt is accepted at 100%; the playable video appears ~3s later in the same tile
        - the results + prompt box live in a chat panel that is itself role="dialog" (open all along)
    -->
    <style>
        body { font: 14px system-ui, sans-serif; margin: 0; background: #111; color: #eee; }
        main { padding: 16px; display: grid; grid-template-columns: repeat(auto-fill, 280px); gap: 12px; min-height: 60vh; }
        .card { position: relative; width: 280px; height: 200px; background: #222; border-radius: 10px; overflow: hidden; display: grid; place-items: center; }
        .card video { width: 100%; height: 100%; object-fit: cover; }
        .card:hover .css-only { display: flex; }
        .card .css-only { position: absolute; bottom: 6px; right: 6px; display: none; }
        .composer { position: fixed; bottom: 0; left: 0; right: 0; padding: 12px; background: #1a1a1a; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        /* Real layout: prompt box on top; below it "+" on the left, then frames, sliders, arrow on the right. */
        .composer textarea { order: -1; flex: 1 0 100%; height: 48px; }
        .composer #frames { margin-left: auto; }
        .menu { position: fixed; background: #333; padding: 4px; border-radius: 8px; }
        .viewer { position: fixed; inset: 40px; background: #000d; border: 1px solid #555; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
        .viewer textarea { height: 48px; }
        button { font: inherit; }
    </style>
</head>
<body>
    <header style="padding: 8px 16px">
        <a href="#" aria-label="Google Account" style="color:#9cf">Account</a>
        <!-- Decoy: other "Create…" controls exist outside the composer on the real site. -->
        <button id="decoy" aria-label="Create new collection">add</button>
    </header>
    <!-- Flow's chat side panel may itself be a dialog, open the whole time: it is the workspace. -->
    <section id="panel" role="dialog" aria-label="Chat panel">
    <main id="grid">
        <div class="card"><video muted aria-label="old result" src="data:video/mp4;base64,AAAA"></video></div>
    </main>
    <div class="composer">
        <button id="addMedia" class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M11 5h2v14h-2zM5 11h14v2H5z" fill="currentColor"/></svg></button>
        <textarea placeholder="What do you want to create?"></textarea>
        <button id="frames" class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" fill="currentColor"/></svg></button>
        <button id="settings" class="icon"><svg width="20" height="20" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="currentColor"/></svg></button>
        <!-- Right-pointing arrow ICON only (SVG, no text, no aria-label), disabled until the prompt registers. -->
        <button id="create" class="icon" disabled><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 4l-1.4 1.4L16.2 11H4v2h12.2l-5.6 5.6L12 20l8-8z" fill="currentColor"/></svg></button>
    </div>
    </section>

    <script>
        // ---- mock app behaviour -------------------------------------------------
        const grid = document.getElementById('grid');
        const input = document.querySelector('.composer textarea');
        const createBtn = document.getElementById('create');
        window.mock = { submissions: [], viewerSubmissions: [], downloads: [], failNext: null, decoyClicks: 0, ignoredClicks: 0, busy: false, realClick: false, viewerOpened: 0, readyAt: [], downloadedAt: [] };
        for (const id of ['decoy', 'addMedia', 'frames', 'settings']) document.getElementById(id).addEventListener('click', () => window.mock.decoyClicks++);

        // The app only enables Create once its own state has seen the text (a beat after input).
        const syncCreate = () => { createBtn.disabled = window.mock.busy || !input.value.trim(); };
        input.addEventListener('input', () => setTimeout(syncCreate, 300));

        function progressCard() {
            const card = document.createElement('div');
            card.className = 'card';
            const bar = document.createElement('div');
            bar.setAttribute('role', 'progressbar');
            bar.setAttribute('aria-valuenow', '0');
            bar.textContent = '0%';
            card.append(bar);
            grid.prepend(card);
            let pct = 0;
            const timer = setInterval(() => {
                pct = Math.min(99, pct + 25);
                bar.setAttribute('aria-valuenow', String(pct));
                bar.textContent = `${pct}%`;
            }, 250);
            // Like Flow: the finished tile keeps showing "100%" for a while after the video is ready.
            const done = () => {
                clearInterval(timer);
                bar.setAttribute('aria-valuenow', '100');
                bar.textContent = '100%';
                setTimeout(() => bar.remove(), 30000);
            };
            return { card, done };
        }

        async function videoBlobUrl() {
            const c = document.createElement('canvas');
            c.width = 160; c.height = 120;
            const g = c.getContext('2d');
            const rec = new MediaRecorder(c.captureStream(10), { mimeType: 'video/webm' });
            const chunks = [];
            rec.ondataavailable = (e) => chunks.push(e.data);
            rec.start();
            for (let i = 0; i < 5; i++) { g.fillStyle = `hsl(${i * 60},70%,50%)`; g.fillRect(0, 0, 160, 120); await new Promise((r) => setTimeout(r, 60)); }
            rec.stop();
            await new Promise((r) => (rec.onstop = r));
            return URL.createObjectURL(new Blob(chunks, { type: 'video/webm' }));
        }

        function toast(text) {
            const t = document.createElement('div');
            t.setAttribute('role', 'alert');
            t.textContent = text;
            t.style.cssText = 'position:fixed;top:8px;left:50%;background:#822;padding:6px 12px;border-radius:6px';
            document.body.append(t);
        }

        function addVideo(card, src) {
            const v = document.createElement('video');
            v.muted = true;
            v.src = src;
            card.append(v);
            window.mock.readyAt.push(Date.now());
            const dl = document.createElement('button');
            dl.className = 'css-only'; // revealed only by CSS :hover
            dl.setAttribute('aria-label', 'Download');
            dl.innerHTML = '<i>download</i>';
            dl.addEventListener('click', () => {
                const menu = document.createElement('div');
                menu.className = 'menu';
                menu.setAttribute('role', 'menu');
                menu.style.cssText = 'top:120px;left:120px';
                const item = document.createElement('div');
                item.setAttribute('role', 'menuitem');
                item.textContent = 'Original size (720p)';
                item.addEventListener('click', () => { window.mock.downloads.push(v.src); window.mock.downloadedAt.push(Date.now()); menu.remove(); });
                menu.append(item);
                document.body.append(menu);
            });
            card.append(dl);
        }

        /** Result viewer with its own prompt box, inserted BEFORE the main composer in the DOM. */
        function openViewer(src) {
            window.mock.viewerOpened++;
            const viewer = document.createElement('div');
            viewer.className = 'viewer';
            viewer.setAttribute('role', 'dialog');
            viewer.setAttribute('aria-modal', 'true');
            viewer.innerHTML = '<button aria-label="Close">close</button><video muted></video><textarea placeholder="What do you want to create?"></textarea><button class="send"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M12 4l8 8-8 8" fill="currentColor"/></svg></button>';
            viewer.querySelector('video').src = src;
            const ta = viewer.querySelector('textarea');
            viewer.querySelector('.send').addEventListener('click', () => window.mock.viewerSubmissions.push(ta.value));
            viewer.querySelector('[aria-label=Close]').addEventListener('click', () => viewer.remove());
            viewer.addEventListener('keydown', (e) => e.key === 'Escape' && viewer.remove());
            document.body.prepend(viewer);
        }

        // Like Flow's arrow: script-made clicks (isTrusted=false) are ignored. run-adapter.js stands in
        // for the real debugger click by setting mock.realClick while it clicks at the coordinates.
        createBtn.addEventListener('click', async (event) => {
            if (!event.isTrusted && !window.mock.realClick) { window.mock.ignoredClicks++; return; }
            const prompt = input.value;
            const index = window.mock.submissions.push({ prompt }) - 1;
            window.mock.busy = true;
            createBtn.disabled = true;
            input.value = ''; // Flow clears the composer after submitting
            const { card, done } = progressCard();
            if (window.mock.failNext) {
                const msg = window.mock.failNext; window.mock.failNext = null;
                setTimeout(() => { done(); card.remove(); toast(msg); window.mock.busy = false; syncCreate(); }, 400);
                return;
            }
            setTimeout(async () => {
                // 100%: Flow accepts the next prompt now; the playable video only shows up later.
                done();
                window.mock.busy = false;
                syncCreate();
                await new Promise((r) => setTimeout(r, 3000));
                const src = await videoBlobUrl();
                window.mock.submissions[index].src = src;
                if (index === 1) {
                    // Collapsed result: an inline toggle reveals the clip.
                    const show = document.createElement('button');
                    show.textContent = 'Show 1 Videos';
                    show.addEventListener('click', () => { show.remove(); addVideo(card, src); });
                    card.append(show);
                } else {
                    addVideo(card, src);
                }
                if (index === 0) setTimeout(() => openViewer(src), 100); // Flow opens the new result
            }, 1500);
        });
    </script>

    <!-- the real content-script modules under test (not content.js: it needs chrome.runtime) -->
    <script src="../../src/content/selectors.js"></script>
    <script src="../../src/content/dom-utils.js"></script>
    <script src="../../src/content/flow-adapter.js"></script>
    <script src="run-adapter.js"></script>
</body>
</html>
